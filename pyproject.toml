[project]
name = "agol-provision"
version = "0.1.0"
description = "Provision a complete ArcGIS Online project from templates: master feature service, views, groups, maps, and apps."
requires-python = ">=3.11,<3.13"
dependencies = [
    # remap_data() requires 2.4.0+; WebExperience requires 2.2.0+
    "arcgis>=2.4.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
agol-provision = "agol_provision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agol_provision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
